<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Basic CSS</title>

    <style>
        #short{
            color: red;
            text-align: center;
        }
        p{
            background-color: rgba(128, 255, 0, 0.594);
            width: 50%;
        }
       li{
        color:brown;
       }
     #embedded{
        font-size:larger;
        font-weight: bold;
     }
     .player{
        text-align: right;
     }

    </style>
</head>
<body>
    <h3 style="color: blue;">Learning basic css</h3>
    <h4 style="background-color: aqua;">Inline CSS</h4>
    <p>CSS meaning: cascading style sheet</p>
    <p>style is colorful</p>
    <p id="short">short form is css</p>
    <p class="player">Needs style rule and value separated by colon(:)</p>
    <p class="player">After each styles you need to use sami-colon(;)</p>
    <ul>
        <li>Inline</li>
       <li id="embedded">Internal</li>
       <li>External</li>

    </ul>
    <p class="player">This is  a stand alone paragraph</p>
    
</body>
</html>
